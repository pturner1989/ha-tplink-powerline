<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0288D1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80" fill="url(#bg)" />

  <!-- Power plug prong left -->
  <rect x="170" y="70" width="36" height="90" rx="8" fill="white" />
  <!-- Power plug prong right -->
  <rect x="306" y="70" width="36" height="90" rx="8" fill="white" />

  <!-- Plug body -->
  <rect x="140" y="140" width="232" height="72" rx="16" fill="white" />

  <!-- Cable from plug down -->
  <rect x="238" y="212" width="36" height="40" rx="4" fill="white" />

  <!-- Network signal waves - well separated -->
  <!-- Outer arc -->
  <path d="M 110 400 A 160 160 0 0 1 402 400" fill="none" stroke="white" stroke-width="22" stroke-linecap="round" />
  

  <!-- Dot at center bottom -->
  <circle cx="256" cy="420" r="22" fill="white" />
</svg>
